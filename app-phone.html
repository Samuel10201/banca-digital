<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>app-phone — Banca Digital</title>
  <!--
    CANAL 1 de 3 — app-phone.
    Este archivo es un SHELL: no contiene ni una pantalla. Declara el marco del
    dispositivo y carga el mismo motor y el mismo registro de pantallas que los
    otros dos canales. Lo unico propio es canal-phone.css.
  -->
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/componentes.css">
  <link rel="stylesheet" href="css/canal-phone.css">
</head>
<body class="escritorio">

  <aside class="consola" id="consola"></aside>

  <main class="dispositivo dispositivo--phone" data-canal="phone" data-inicio="bienvenida">
    <div class="muesca"></div>
    <div class="lienzo">

      <div class="estado-barra">
        <span>9:41</span>
        <span class="estado-barra__iconos">
          <svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor"><rect x="0" y="7" width="3" height="4" rx="1"/><rect x="4.5" y="5" width="3" height="6" rx="1"/><rect x="9" y="2.5" width="3" height="8.5" rx="1"/><rect x="13.5" y="0" width="3" height="11" rx="1"/></svg>
          <svg width="16" height="11" viewBox="0 0 16 11" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M1 4.2a10 10 0 0 1 14 0"/><path d="M3.7 6.9a6.2 6.2 0 0 1 8.6 0"/><path d="M6.4 9.4a2.4 2.4 0 0 1 3.2 0"/></svg>
          <svg width="25" height="12" viewBox="0 0 25 12" fill="none"><rect x=".7" y=".7" width="20.6" height="10.6" rx="3" stroke="currentColor" stroke-opacity=".4" stroke-width="1.2"/><rect x="2.4" y="2.4" width="17" height="7.2" rx="1.8" fill="currentColor"/><path d="M23 4.2v3.6a2 2 0 0 0 0-3.6z" fill="currentColor" fill-opacity=".4"/></svg>
        </span>
      </div>

      <header class="cabecera" id="cabecera"></header>
      <div class="cuerpo scroll" id="cuerpo"></div>
      <nav class="nav nav--phone" id="nav"></nav>

      <div class="barra-inferior"></div>
    </div>
  </main>

  <script src="js/datos.js"></script>
  <script src="js/pantallas.js"></script>
  <script src="js/navegacion.js"></script>
  <script>
    // El telefono lleva boton central: es el patron de la referencia de UX.
    document.addEventListener('DOMContentLoaded', function () {
      montarNavegacion('nav', true);
      montarConsola('phone');
    });
  </script>
</body>
</html>
